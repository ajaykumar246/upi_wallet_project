services:
  # 1. Node.js API Service
  api:
    build: .             # Build from current directory
    container_name: upi_app_container
    ports:
      - "3000:3000"      # Expose API port 3000
    environment:
      - DB_HOST=postgres_db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=upi_project
      - DB_PORT=5432
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - JWT_SECRET=qwertyuiopasdfghjklzxcvbnm
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    restart: always

  # 2. PostgreSQL Database
  postgres_db:
    image: postgres:16-alpine
    container_name: upi_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: upi_project
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upi_project"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Redis Cache
  redis_cache:
    image: redis:alpine
    container_name: upi_redis_container
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 4. React Frontend
  frontend:
    build: ./frontend
    container_name: upi_frontend_container
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: always

# Persistent storage volume
volumes:
  pgdata: